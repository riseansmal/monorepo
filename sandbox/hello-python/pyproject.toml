[project]
name = "hello-python"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "hatchling"]

[tool.ruff]
extend = "../../tooling/python/ruff.toml"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
